# Systemd securely supplies the root-owned HA ingress secret to the gateway user.
[Service]
LoadCredential=ingress-secret:/opt/homeassistant/.woow_ingress_secret
ExecStart=
ExecStart=/usr/bin/python3 /opt/woow-deploy/overlays/woow-auth-gateway/woow_auth_gateway.py --secret-file %d/ingress-secret --pi-upstream http://127.0.0.1:30141
