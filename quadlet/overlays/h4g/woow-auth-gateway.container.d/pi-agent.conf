# H4G overlay: also protect Pi Agent. Install as
# /etc/containers/systemd/woow-auth-gateway.container.d/pi-agent.conf.
# Quadlet takes the last Exec=, so this replaces the base's `--pi-port 0`;
# Tailscale Web keeps its defaults (:8088 -> 127.0.0.1:8089).
[Container]
Exec=--pi-port 30142 --pi-upstream http://127.0.0.1:30141
